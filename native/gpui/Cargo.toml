[package]
name = "agu-chat-gpui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agu-chat-gpui"
path = "src/main.rs"

[dependencies]
agu-chat-core = { path = "../core" }
gpui = "=0.2.2"
futures = "0.3"
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
