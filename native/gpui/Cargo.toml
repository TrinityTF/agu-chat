[package]
name = "agu-chat-gpui"
version = "0.2.1"
edition = "2021"

[[bin]]
name = "agu-chat-gpui"
path = "src/main.rs"

[dependencies]
agu-chat-core = { path = "../core" }
gpui = "=0.2.2"
futures = "0.3"
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
image = { version = "0.25", default-features = false }
fancy-regex = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "gzip"] }
crossbeam-channel = "0.5"
smallvec = "1"
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
raw-window-handle = "0.6"
wry = "0.53"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Globalization", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Console", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Foundation_Numerics"] }
webview2-com = "0.38"
windows-core = "0.61"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# the versions GPUI itself resolves on macOS (see Cargo.lock), so no second copy is built
core-foundation = "0.10"
core-graphics = "0.24"
core-text = "21"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[features]
# Counts live heap bytes (logged with the AGU_LOG memstat line) to tell heap from GPU/driver memory.
alloc-stats = []
