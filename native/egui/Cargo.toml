[package]
name = "agu-chat-native"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agu-chat-native"
path = "src/main.rs"

[dependencies]
agu-chat-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
crossbeam-channel = "0.5"
egui = { version = "0.37", default-features = false }

[dependencies.eframe]
version = "0.37"
default-features = false
features = ["glow", "default_fonts"]
