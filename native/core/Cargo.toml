[package]
name = "agu-chat-core"
version = "0.2.1"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "gzip", "stream"] }
md5 = "0.7"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
image = { version = "0.25", default-features = false, features = ["webp", "gif", "png", "jpeg"] }
crossbeam-channel = "0.5"
rand = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
url = "2"
resvg = { version = "0.45.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
