# Builds the Windows installer and the macOS app and publishes both in one GitHub release.
#   * runs only by hand (workflow_dispatch, from main) or when a `v*` tag is pushed; never on a branch push
#   * manual run: releases the version in native/gpui/Cargo.toml and creates the tag v<version> on the run's commit
#     (fails if that tag already exists)
#   * tag push: the version is the tag without its leading `v`; it must equal native/gpui/Cargo.toml's version
#   * a version with a -suffix, or with major 0, is a prerelease (published with --prerelease --latest=false);
#     a full release (>= 1.0.0, no suffix) is published as "latest"
#   * assets: Agu-Chat-Setup-<version>-x64.exe + .sha256 (Windows), Agu-Chat-<version>-mac.zip + .sha256 (macOS,
#     Apple Silicon); title "Agu Chat <version>"
#   * jobs: version -> windows + mac (in parallel, artifacts only) -> publish (draft, upload, check, publish), so the
#     app never sees a release with only some of its files
# Versions are set by hand in Cargo.toml. Update rules (native/core/src/updater.rs): docs/GPUI-PORT.md "Installer and updates".
name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags

      - name: Work out the version
        id: ver
        run: |
          cargo_version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' native/gpui/Cargo.toml | head -n 1)"
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$cargo_version" ]; then echo "Tag $GITHUB_REF_NAME does not match native/gpui/Cargo.toml ($cargo_version)"; exit 1; fi
          else
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "Run this workflow from the main branch."; exit 1; fi
            version="$cargo_version"
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then echo "Bad version '$version'"; exit 1; fi
          tag="v$version"
          if [ "${{ github.event_name }}" != "push" ] && git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then echo "Tag $tag already exists"; exit 1; fi
          prerelease=false
          if echo "$version" | grep -q -- '-' || [ "${version%%.*}" = "0" ]; then prerelease=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Agu Chat $version ($tag, prerelease=$prerelease)"

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}
          restore-keys: native-${{ runner.os }}-

      - name: Test
        working-directory: native
        run: cargo test -p agu-chat-core -p agu-chat-gpui

      - name: Build
        working-directory: native
        env:
          AGU_BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: cargo build --release -p agu-chat-gpui

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $env:NSIS_HOME = "${env:ProgramFiles(x86)}\NSIS"
          native\installer\build-installer.ps1 -Version "${{ needs.version.outputs.version }}" -Exe native\target\release\agu-chat-gpui.exe -OutDir native\dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            native/dist/Agu-Chat-Setup-${{ needs.version.outputs.version }}-x64.exe
            native/dist/Agu-Chat-Setup-${{ needs.version.outputs.version }}-x64.exe.sha256
          if-no-files-found: error

  mac:
    needs: version
    runs-on: macos-latest
    env:
      # native/rust-toolchain.toml pins the Windows MSVC host; on the Mac runner use plain stable instead
      RUSTUP_TOOLCHAIN: stable
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustc --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-mac-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: native-mac-

      - name: Test
        working-directory: native
        run: cargo test -p agu-chat-core -p agu-chat-gpui

      - name: Build
        working-directory: native
        env:
          AGU_BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: cargo build --release -p agu-chat-gpui

      - name: Bundle
        run: |
          version="${{ needs.version.outputs.version }}"
          sh native/installer/mac/bundle.sh native/target/release/agu-chat-gpui "$version" native/dist
          cd native/dist
          zip="Agu-Chat-$version-mac.zip"
          shasum -a 256 "$zip" > "$zip.sha256" # "<hash>  <name>", like the Windows installer's

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            native/dist/Agu-Chat-${{ needs.version.outputs.version }}-mac.zip
            native/dist/Agu-Chat-${{ needs.version.outputs.version }}-mac.zip.sha256
          if-no-files-found: error

  publish:
    needs: [version, windows, mac]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags: the release notes read them

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        run: |
          # the previous native release: skip the old Electron tags (v0.0.*) and this release's own tag
          prev="$(git tag --list 'v*' --sort=-creatordate | grep -v '^v0\.0\.' | grep -v -x "$TAG" | head -n 1 || true)"
          if [ -z "$prev" ]; then
            notes="- First release"
          else
            notes="$(git log "$prev..HEAD" --no-merges --format='- %s' -n 40)"
            if [ -z "$notes" ]; then notes="- Improvements and fixes"; fi
          fi
          {
            printf '%s\n\n' "$notes"
            printf '**Windows 10 / 11:** download `Agu-Chat-Setup-%s-x64.exe` and run it.\n\n' "$VERSION"
            printf '**macOS 11+ (Apple Silicon):** download `Agu-Chat-%s-mac.zip`, open it and drag Agu Chat into Applications. The first time, right-click the app and choose **Open** (it is not signed by Apple yet).\n' "$VERSION"
          } > release-notes.md
          cat release-notes.md

      # The draft release is created up front and published last, so the app never sees a half-uploaded release.
      # For a manual run, --target makes GitHub create the tag v<version> on this run's commit when it is published.
      - name: Create draft release and upload
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release delete "$TAG" --yes # an unpublished leftover of a failed earlier run of the same tag
            else
              echo "Release $TAG is already published."; exit 1
            fi
          fi
          gh release create "$TAG" --draft $flags --title "Agu Chat $VERSION" --target "$GITHUB_SHA" --notes-file release-notes.md
          gh release upload "$TAG" \
            "dist/Agu-Chat-Setup-$VERSION-x64.exe" "dist/Agu-Chat-Setup-$VERSION-x64.exe.sha256" \
            "dist/Agu-Chat-$VERSION-mac.zip" "dist/Agu-Chat-$VERSION-mac.zip.sha256"

      - name: Check the assets are there
        run: |
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$assets"
          for f in "Agu-Chat-Setup-$VERSION-x64.exe" "Agu-Chat-Setup-$VERSION-x64.exe.sha256" "Agu-Chat-$VERSION-mac.zip" "Agu-Chat-$VERSION-mac.zip.sha256"; do
            echo "$assets" | grep -qx "$f"
          done

      - name: Publish release
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
