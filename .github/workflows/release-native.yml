# Builds the NATIVE (Rust/GPUI) Windows installer and publishes it as a GitHub release.
# Separate from release.yml (the Electron app) on purpose:
#   * it never runs on a push to a branch: only by hand (workflow_dispatch) or when a `native-v*` tag is pushed
#   * its releases are tagged `native-v<version>` (not semver for electron-updater, so Electron installs skip them),
#     are NEVER marked "latest" (Electron stable installs read /releases/latest), and carry their own assets
#     `Agu-Chat-Native-Setup-<version>-x64.exe` + `.sha256` (no latest.yml), which the Electron updater ignores
#   * the native updater (native/core/src/updater.rs) only looks at `native-v*` releases with that installer asset
# Naming scheme and channel rules: docs/GPUI-PORT.md "Installer and updates".
#   manual run, channel = beta    -> prerelease  native-v<base>-beta.<run number>
#   manual run, channel = stable  -> full release native-v<base>     (stable runs come from main only)
#   tag push native-v<version>    -> the release of that tag (prerelease when the version has a -suffix)
# <base> is the version in native/gpui/Cargo.toml.
name: Build and release (native)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel (beta = prerelease, stable = full release)'
        type: choice
        options: [beta, stable]
        default: beta
  push:
    tags:
      - 'native-v*'

permissions:
  contents: write

concurrency:
  group: release-native
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags: version numbering and release notes read them

      - name: Work out the version
        id: ver
        run: |
          base="$(sed -n 's/^version *= *"\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/p' native/gpui/Cargo.toml | head -n 1)"
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#native-v}"
          elif [ "${{ inputs.channel }}" = "stable" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "Stable releases must be run from the main branch."; exit 1; fi
            version="$base"
          else
            version="$base-beta.${{ github.run_number }}"
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then echo "Bad version '$version'"; exit 1; fi
          prerelease=false
          if echo "$version" | grep -q -- '-'; then prerelease=true; fi
          tag="native-v$version"
          if [ "${{ github.event_name }}" != "push" ] && git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then echo "Tag $tag already exists"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Native $version ($tag, prerelease=$prerelease)"

      - name: Release notes
        run: |
          mkdir -p native/dist
          prev="$(git tag --list 'native-v*' --sort=-creatordate | grep -v -x "${{ steps.ver.outputs.tag }}" | head -n 1 || true)"
          range="${prev:+$prev..}HEAD"
          notes="$(git log $range --no-merges --format='- %s' -n 40 -- native docs/GPUI-PORT.md .github/workflows/release-native.yml)"
          if [ -z "$notes" ]; then notes="- Improvements and fixes"; fi
          printf '%s\n' "$notes" > native/dist/release-notes.md
          cat native/dist/release-notes.md

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/rust-toolchain.toml') }}
          restore-keys: native-${{ runner.os }}-

      - name: Test
        working-directory: native
        run: cargo test -p agu-chat-core -p agu-chat-gpui

      - name: Build
        working-directory: native
        env:
          AGU_BUILD_VERSION: ${{ steps.ver.outputs.version }}
        run: cargo build --release -p agu-chat-gpui

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $env:NSIS_HOME = "${env:ProgramFiles(x86)}\NSIS"
          native\installer\build-installer.ps1 -Version "${{ steps.ver.outputs.version }}" -Exe native\target\release\agu-chat-gpui.exe -OutDir native\dist

      # The draft release is created up front and published last, so the app never sees a half-uploaded release.
      - name: Create draft release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          flags=""
          if [ "${{ steps.ver.outputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          if gh release view "$tag" > /dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release delete "$tag" --yes # an unpublished leftover of a failed earlier run of the same tag
            else
              echo "Release $tag is already published."; exit 1
            fi
          fi
          gh release create "$tag" --draft $flags --title "Agu Chat (native) ${{ steps.ver.outputs.version }}" --target "$GITHUB_SHA" --notes-file native/dist/release-notes.md
          gh release upload "$tag" "native/dist/Agu-Chat-Native-Setup-${{ steps.ver.outputs.version }}-x64.exe" "native/dist/Agu-Chat-Native-Setup-${{ steps.ver.outputs.version }}-x64.exe.sha256"

      - name: Check the assets are there
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="$(gh release view "${{ steps.ver.outputs.tag }}" --json assets --jq '.assets[].name')"
          echo "$assets"
          echo "$assets" | grep -qx "Agu-Chat-Native-Setup-${{ steps.ver.outputs.version }}-x64.exe"
          echo "$assets" | grep -qx "Agu-Chat-Native-Setup-${{ steps.ver.outputs.version }}-x64.exe.sha256"

      # Never "latest": Electron stable installs read /releases/latest and would find no latest.yml there.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.ver.outputs.prerelease }}" = "true" ]; then
            gh release edit "${{ steps.ver.outputs.tag }}" --draft=false --prerelease --latest=false
          else
            gh release edit "${{ steps.ver.outputs.tag }}" --draft=false --prerelease=false --latest=false
          fi
